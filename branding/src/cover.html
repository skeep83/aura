<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; }
  body { position: relative; font-family: "Avenir Next", "Helvetica Neue", -apple-system, sans-serif; color: #fff;
    background: linear-gradient(135deg, #36d1f0 0%, #4a86f7 52%, #5a4ff0 100%); }
  .blob { position: absolute; border-radius: 50%; background: rgba(255,255,255,.16); }
  .tube { position: absolute; inset: 0; }
  .glass { position: absolute; left: 28px; top: 28px; right: 28px; bottom: 28px; border-radius: 32px;
    background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 20px 50px rgba(30,30,120,.25);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: flex; align-items: center; gap: 30px; padding: 0 36px; }
  .mark { width: 168px; height: 168px; border-radius: 42px; overflow: hidden; flex: none;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.6), 0 18px 40px rgba(20,20,110,.35); }
  .mark img { width: 100%; height: 100%; display: block; }
  h1 { margin: 0; font-size: 76px; font-weight: 800; letter-spacing: -.01em; line-height: .95; text-shadow: 0 4px 18px rgba(20,20,110,.25); }
  p { margin: 10px 0 18px; font-size: 19px; font-weight: 600; opacity: .95; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; max-width: 330px; }
  .chip { padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.45); }
</style></head>
<body>
  <div class="blob" style="width:340px;height:340px;right:-90px;top:-150px"></div>
  <div class="blob" style="width:260px;height:260px;left:-100px;bottom:-130px;opacity:.7"></div>
  <svg class="tube" viewBox="0 0 640 360" preserveAspectRatio="none">
    <defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ff0ff"/><stop offset="1" stop-color="#3b2fd6"/></linearGradient></defs>
    <path d="M-40 300 C 120 180 260 380 420 230 S 640 60 700 120" fill="none" stroke="url(#t)" stroke-width="46" stroke-linecap="round" opacity=".55"/>
  </svg>
  <div class="glass">
    <div class="mark"><img src="../logo.svg" alt=""></div>
    <div>
      <h1>aura</h1>
      <p>видеочат со всем миром</p>
      <div class="chips">
        <span class="chip">🌍 по языку</span><span class="chip">✨ взаимный вайб</span>
        <span class="chip">🎲 игры</span><span class="chip">🔥 Aura Hour</span>
      </div>
    </div>
  </div>
</body></html>
