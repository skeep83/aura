# Фронтенд Aura: статика Mini App + прокси к бэкенду (WebSocket, API, карточки Stories).
# Туннель Cloudflare приходит сюда, бэкенд наружу не торчит.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(self)" always;

    # Посадочная страница рекламы: /go?c=<код кампании>
    location = /go {
        rewrite ^ /go.html last;
    }

    # Короткая ссылка из карточек и Stories: /r/<id> → лендинг с реферальной ссылкой автора
    location ~ "^/r/[A-Za-z0-9_-]{1,40}$" {
        rewrite ^/r/(.+)$ /go.html?r=$1 last;
    }

    # Правовые страницы — индексируемые адреса без .html (каталоги и поиск требуют реальные URL)
    location = /privacy {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files /privacy.html =404;
    }
    location = /terms {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files /terms.html =404;
    }
    # EN-версии правовых страниц (HOM-24): путевая схема /en/... для каталогов и hreflang
    location = /en/privacy {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files /privacy.en.html =404;
    }
    location = /en/terms {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files /terms.en.html =404;
    }

    # Бэкенд: WebSocket подбора пар и сигналинга
    location = /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Бэкенд: API, карточки для Stories, проверка здоровья
    location ~ ^/(api/|s/|healthz$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 3m;
    }

    # Картинки бренда можно забирать с других сайтов (загрузка в @BotFather)
    location ^~ /brand/ {
        add_header Access-Control-Allow-Origin * always;
        expires 7d;
    }

    # Главная страница — без кэша, чтобы обновления доходили сразу
    # (add_header внутри location отменяет заголовки уровня server — поэтому повторяем)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files /index.html =404;
    }

    # Скрипты и стили без хэшей в имени — короткий кэш с проверкой ETag
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(png|svg|jpg|webp)$ { expires 7d; }
}
